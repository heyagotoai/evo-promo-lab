name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck · testy · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Typy
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Build produkcyjny
        run: npm run build
